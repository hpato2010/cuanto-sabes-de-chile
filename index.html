/* ---- Sonido (sintetizado con Web Audio, sin archivos) ---- */
let actx=null, soundOn=true;
try{ soundOn=localStorage.getItem("trivia-sound")!=="off"; }catch(e){}
function ac(){
  if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; actx=new C(); }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function tone(freq,start,dur,type="triangle",vol=.18,slideTo){
  const c=ac(); if(!c||!soundOn) return;
  const t=c.currentTime+start, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
/* Instrumentos sintetizados con timbre real: campana, bocina de auto, chicharra de concurso, reloj, aplausos, trombón triste */
let master=null, noiseBuf=null;
function out(){
  const c=ac(); if(!c) return null;
  if(!master){
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master=c.createGain(); master.gain.value=.9; master.connect(comp).connect(c.destination);
    noiseBuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return c;
}
function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
// Campana / vibráfono: parciales inarmónicos con caída larga
function bell(f,at,vol=.25,dec=1.4){
  const c=out(); if(!c||!soundOn) return; const t=c.currentTime+at;
  [[1,1],[2.76,.45],[5.4,.22],[8.93,.1]].forEach(([m,v])=>{
    const o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f*m;
    env(g,t,.004,vol*v,dec/m**.5); o.connect(g).connect(master); o.start(t); o.stop(t+dec+.1);
  });
}
// Ruido filtrado (golpes de madera, aplausos)
function burst(at,freq,q,vol,dec,type="bandpass"){
  const c=out(); if(!c||!soundOn) return; const t=c.currentTime+at;
  const s=c.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=.8+Math.random()*.4;
  const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain(); env(g,t,.002,vol,dec);
  s.connect(f).connect(g).connect(master); s.start(t,Math.random()*1.5); s.stop(t+dec+.05);
}
// Fuente "metálica" (bocina, chicharra, trombón): ondas desafinadas por un filtro pasa-bajos
function brass(freqs,at,dur,vol,cut,type="sawtooth",bend){
  const c=out(); if(!c||!soundOn) return; const t=c.currentTime+at;
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=cut; lp.Q.value=1.2;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.setValueAtTime(vol,t+dur-.05); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  lp.connect(g).connect(master);
  freqs.forEach(fr=>[-6,0,6].forEach(cents=>{
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(fr,t); o.detune.value=cents;
    if(bend) o.frequency.exponentialRampToValueAtTime(fr*bend,t+dur);
    o.connect(lp); o.start(t); o.stop(t+dur+.05);
  }));
  return {t,dur};

const BUF={}; let clockSrc=null, yaySrc=null;
function loadBufs(){
  const c=out(); if(!c) return;
  Object.entries(AUDIO).forEach(([k,uri])=>{
    if(BUF[k]) return;
    const bin=atob(uri.split(",")[1]), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    c.decodeAudioData(u.buffer).then(b=>BUF[k]=b).catch(()=>{});
  });
}
function playBuf(k,vol=1){
  const c=out(); if(!c||!soundOn||!BUF[k]) return null;

}

  finish(good){
    if(good && BUF.applause){
      [523,659,784,1047].forEach((f,i)=>bell(f,i*.11,.22,1.6)); playBuf("applause",.9);
    } else if(!good && BUF.trumpet){
      playBuf("trumpet",1);
    } else if(good){
      // Fanfarria de campanas + aplausos del público
      [523,659,784,1047].forEach((f,i)=>bell(f,i*.11,.22,1.6));
      for(let i=0;i<220;i++){ const at=.35+Math.random()*2.6*Math.sqrt(Math.random());
        burst(at,900+Math.random()*1600,1.2+Math.random()*1.5,.15+Math.random()*.25,.03+Math.random()*.04); }
    } else {
      // Trombón triste: "wah wah wah waaah"
      [[294,0,.38],[277,.42,.38],[262,.84,.38],[247,1.26,1.1]].forEach(([f,at,d],i)=>{
        brass([f],at,d,.18,1100,"sawtooth",i===3?.94:1);
      });
    }
  }
};

const CATS=[...new Set(BANK.map(q=>q[0]))];
const SEEN_KEY="cuanto-sabes-chile-vistas";
function getSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]")); }catch(e){ return new Set(); } }
function saveSeen(set){ try{ localStorage.setItem(SEEN_KEY,JSON.stringify([...set])); }catch(e){} }
// Arma una partida: pregunta por pregunta va rotando los temas, y prefiere las que este jugador no ha visto
function pickRound(){
  let seen=getSeen();
  const fresh=BANK.map((q,i)=>i).filter(i=>!seen.has(i));
  if(fresh.length<ROUNDS){ seen=new Set(); }          // ya vio casi todo: se reinicia el mazo
  const pools={};
  shuffle(BANK.map((q,i)=>i)).forEach(i=>{ const c=BANK[i][0]; (pools[c]=pools[c]||{fresh:[],old:[]})[seen.has(i)?"old":"fresh"].push(i); });
  const picked=[]; let order=shuffle(CATS);
  while(picked.length<ROUNDS){
    let added=false;
    for(const c of order){
      if(picked.length>=ROUNDS) break;
      const p=pools[c], i=p.fresh.length?p.fresh.pop():null;
      if(i!==null){ picked.push(i); added=true; }
    }
    if(!added){ for(const c of order){ if(picked.length<ROUNDS && pools[c].old.length) picked.push(pools[c].old.pop()); } }
    order=shuffle(CATS);
  }
  picked.forEach(i=>seen.add(i)); saveSeen(seen);
  return shuffle(picked).map(i=>BANK[i]);
}

const $=s=>document.querySelector(s);
const sndBtn=$("#snd");
function paintSnd(){ sndBtn.setAttribute("aria-pressed",soundOn); sndBtn.textContent=(soundOn?"🔊":"🔇")+" Sonido"; }
sndBtn.onclick=()=>{ soundOn=!soundOn; try{localStorage.setItem("trivia-sound",soundOn?"on":"off")}catch(e){} paintSnd(); if(soundOn) SFX.click(); };
paintSnd();
const card=$("#card"), track=$("#track");
let S;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawTrack(pos){
  track.innerHTML=CITIES.map((c,i)=>`<div class="stop ${i<pos?'passed':''} ${i===pos?'here':''}"><span class="dot"></span><span class="city">${c}</span></div>`).join("")+`<span class="done-line" id="dl"></span>`;
  const stops=track.querySelectorAll(".stop");
  const a=stops[0].offsetLeft+stops[0].offsetWidth/2, b=stops[pos].offsetLeft+stops[pos].offsetWidth/2;
  const dl=$("#dl"); dl.style.left=a+"px"; dl.style.width=Math.max(0,b-a)+"px";
  const r=track.parentElement; r.scrollTo({left:Math.max(0,b-r.clientWidth/2),behavior:"smooth"});
}

function home(){
  S=null; drawTrack(0);
  card.innerHTML=`
    <span class="cat">Antes de partir</span>
    <p class="q">Recorre Chile respondiendo preguntas sobre todo el país. Hay ${BANK.length} preguntas y no se repiten hasta que las hayas visto todas.</p>
    <ul class="rules">
      <li>15 preguntas nuevas en cada partida, mezclando todos los temas: ${CATS.join(', ').toLowerCase()}.</li>
      <li>Tienes ${SECS} segundos por pregunta.</li>
      <li>Si aciertas, avanzas una ciudad. Si fallas, te quedas donde estás.</li>
    </ul>
    <div class="row"><button class="btn" id="go">Partir desde Arica</button></div>`;
  $("#go").onclick=start;
}

function start(){
  S={qs:pickRound(),i:0,pos:0,score:0,ok:0,t0:0,timer:null};
  loadBufs(); SFX.start();
  ask();
}

function ask(){
  const [cat,q,opts,fact]=S.qs[S.i];
  S.order=shuffle(opts); S.answer=opts[0]; S.fact=fact; S.locked=false; S.lastTick=null; S.recClock=false;
  drawTrack(S.pos);
  card.innerHTML=`
    <div class="meta"><span>Pregunta <b>${S.i+1}</b> / ${ROUNDS}</span><span>Puntos <b>${S.score}</b></span><span id="secs">${SECS} s</span></div>
    <div class="timer"><i id="bar"></i></div>
    <span class="cat">${cat}</span>
    <p class="q">${q}</p>
    <div class="opts">${S.order.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${o}</span></button>`).join("")}</div>
    <div id="after"></div>`;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  S.t0=performance.now();
  clearInterval(S.timer);
  S.timer=setInterval(tick,100);
  $("#opt0").focus({preventScroll:true});
}

function tick(){
  const left=Math.max(0,SECS-(performance.now()-S.t0)/1000);
  const bar=$("#bar"); if(bar) bar.style.width=(left/SECS*100)+"%";
  const sec=Math.ceil(left);
  if(sec<=5 && sec>0 && sec!==S.lastTick){
    if(S.lastTick==null) S.recClock=SFX.clock();   // reloj grabado para los últimos 5 s
    if(!S.recClock) SFX.tick();                    // respaldo sintetizado
    S.lastTick=sec;
  }
  const s=$("#secs"); if(s) s.textContent=sec+" s";
  if(left<=0) answer(-1);
}

function answer(k){
  if(S.locked) return; S.locked=true; clearInterval(S.timer); SFX.stopClock();
  const elapsed=(performance.now()-S.t0)/1000;
  const right=k>=0 && S.order[k]===S.answer;
  card.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;
    if(S.order[j]===S.answer) b.classList.add("right"); else if(j===k) b.classList.add("wrong");});
  right ? SFX.right() : (k<0 ? SFX.timeout() : SFX.wrong());
  let gained=0;
  if(right){gained=100+Math.round(50*Math.max(0,1-elapsed/SECS)); S.score+=gained; S.ok++; S.pos++; drawTrack(S.pos);}
  const last=S.i===ROUNDS-1;
  const head=right?`Correcto · +${gained} pts · llegaste a ${CITIES[S.pos]}`:(k<0?"Se acabó el tiempo":"Incorrecto");
  $("#after").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <p class="fact ${right?'ok':'no'}"><strong>${head}</strong>${right?'':'La respuesta es <b>'+S.answer+'</b>. '}${S.fact}</p>
    <button class="btn" id="next">${last?"Ver resultado":"Siguiente"}</button></div>`;
  $("#next").onclick=()=>{SFX.stopYay(); SFX.click(); S.i++; last?finish():ask()};
  $("#next").focus({preventScroll:true});
}

function verdict(n){
  if(n===15) return "Viaje completo. Llegaste al fin del mundo sin un solo error.";
  if(n>=12) return "Casi en la Patagonia. Te conoces Chile de punta a cabo.";
  if(n>=8) return "Buen viaje por el centro-sur. Te faltaron unos kilómetros.";
  if(n>=4) return "Te quedaste en la zona central. Toca repasar.";
  return "Apenas saliste del norte. ¡Otra vuelta!";
}

function finish(){
  const city=CITIES[S.pos];
  drawTrack(S.pos);
  SFX.finish(S.ok>=8);
  const msg=`Llegué hasta ${city} con ${S.score} puntos (${S.ok}/${ROUNDS} correctas) en la trivia “¿Cuánto sabes de Chile?”. ¿Puedes llegar más al sur?`;
  card.innerHTML=`
    <span class="cat">Fin del viaje</span>
    <div><div class="note">Llegaste hasta</div><div class="big">${city}</div></div>
    <p class="sub" style="color:var(--ink)">${verdict(S.ok)}</p>
    <div class="stats">
      <div class="stat"><span>Puntos</span><b>${S.score}</b></div>
      <div class="stat"><span>Correctas</span><b>${S.ok}/${ROUNDS}</b></div>
      <div class="stat"><span>Ciudades</span><b>${S.pos}</b></div>
    </div>
    <textarea id="share" readonly rows="3" style="font:inherit;font-size:14px;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none">${msg}</textarea>
    <div class="row">
      <button class="btn" id="again">Jugar otra vez</button>
      <button class="btn ghost" id="copy">Copiar resultado</button>
      <span class="note" id="copied" aria-live="polite"></span>
    </div>`;
  $("#again").onclick=start;
  $("#copy").onclick=()=>{
    const t=$("#share");
    navigator.clipboard?.writeText(msg).then(()=>$("#copied").textContent="Copiado. Pégalo en WhatsApp.")
      .catch(()=>{t.select();$("#copied").textContent="Texto seleccionado: cópialo con Ctrl/Cmd + C."})
      ?? (t.select(),$("#copied").textContent="Texto seleccionado: cópialo con Ctrl/Cmd + C.");
  };
}

window.addEventListener("keydown",e=>{
  if(!S||S.locked) return;
  const k="abcd".indexOf(e.key.toLowerCase()); if(k>=0) answer(k);
});
home();
</script>
